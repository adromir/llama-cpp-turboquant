name: Build ROCm (Windows & Linux)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Base tag name for the release (e.g. v1.0.0)'
        required: true
        type: string
      flavor:
        description: 'Flavor to build (all, vanilla, experimental)'
        required: true
        type: choice
        options:
          - all
          - vanilla
          - experimental
        default: 'all'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - id: set-matrix
        run: |
          FLAVOR="${{ github.event.inputs.flavor }}"
          if [ -z "$FLAVOR" ] || [ "$FLAVOR" = "all" ]; then
            echo 'matrix={"include":[{"flavor":"vanilla","branch":"custom-workflow"},{"flavor":"experimental","branch":"experiment/rdna-boosts"}]}' >> $GITHUB_OUTPUT
          elif [ "$FLAVOR" = "vanilla" ]; then
            echo 'matrix={"include":[{"flavor":"vanilla","branch":"custom-workflow"}]}' >> $GITHUB_OUTPUT
          elif [ "$FLAVOR" = "experimental" ]; then
            echo 'matrix={"include":[{"flavor":"experimental","branch":"experiment/rdna-boosts"}]}' >> $GITHUB_OUTPUT
          fi
      - id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: setup
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      HIP_PATH: C:\TheRock\build
      HIP_DEVICE_LIB_PATH: C:\TheRock\build\lib\llvm\amdgcn\bitcode
      HIP_PLATFORM: amd
      LLVM_PATH: C:\TheRock\build\lib\llvm

    steps:
    - name: Checkout branch ${{ matrix.branch }}
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}

    - name: Configure Windows Defender Exclusions
      run: |
        Write-Host "Configuring Windows Defender exclusions for build directories and processes..."
        Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "C:\TheRock" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "clang.exe" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "clang++.exe" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "ninja.exe" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess "lld-link.exe" -ErrorAction SilentlyContinue

    - name: Restore ROCm Install Cache
      id: cache-rocm-restore
      uses: actions/cache/restore@v4
      with:
        path: C:\TheRock\build
        key: rocm-installed-10.0.0-windows-v1

    - name: Download and Install ROCm
      if: steps.cache-rocm-restore.outputs.cache-hit != 'true'
      run: |
        Write-Host "Downloading ROCm 10.0.0 TheRock Windows tarball via curl..."
        New-Item -ItemType Directory -Force -Path C:\TheRock\build | Out-Null
        curl.exe -L --retry 3 --retry-delay 5 -o therock.tar.gz https://stable.repo.amd.com/rocm/core/tarball/therock-dist-windows-gfx120X-all-10.0.0.tar.gz
        
        Write-Host "Extracting tarball to C:\TheRock\build..."
        tar -xzf therock.tar.gz -C C:\TheRock\build --strip-components=1
        
        if (-not (Test-Path "C:\TheRock\build\lib\llvm\bin\clang.exe")) {
            Write-Error "ERROR: clang.exe was not found in C:\TheRock\build\lib\llvm\bin! Extraction failed."
            exit 1
        }
        
        Remove-Item therock.tar.gz -Force

    - name: Save ROCm Install Cache
      if: steps.cache-rocm-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\TheRock\build
        key: rocm-installed-10.0.0-windows-v1

    - name: Verify Tools and Dependencies
      run: |
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
        }
        if (-not (Test-Path "C:\Program Files\OpenSSL-Win64") -and -not (Test-Path "C:\Program Files\OpenSSL")) {
            choco install openssl -y
        }
        if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) {
            choco install ccache --no-progress
        }

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-${{ matrix.flavor }}-rocm-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.flavor }}-rocm-ccache-

    - name: Build llama.cpp (${{ matrix.flavor }})
      env:
        CCACHE_DIR: ${{ github.workspace }}\.ccache
        CCACHE_COMPILERCHECK: string:rocm-10.0.0
        CCACHE_BASEDIR: ${{ github.workspace }}
      run: |
        ccache -z
        $fso = New-Object -ComObject Scripting.FileSystemObject
        $RocmPath = "C:/TheRock/build"
        $ClangBin = "$RocmPath/lib/llvm/bin"
        
        if (Test-Path "C:\Program Files\OpenSSL-Win64") {
            $OpenSslPath = $fso.GetFolder("C:\Program Files\OpenSSL-Win64").ShortPath.Replace('\', '/')
        } elseif (Test-Path "C:\Program Files\OpenSSL") {
            $OpenSslPath = $fso.GetFolder("C:\Program Files\OpenSSL").ShortPath.Replace('\', '/')
        } else {
            Write-Error "OpenSSL installation directory not found!"
            exit 1
        }
        
        # Resolve Resource Compiler
        $RcCompiler = $null
        if (Test-Path "$ClangBin/llvm-rc.exe") {
            $RcCompiler = "$ClangBin/llvm-rc.exe"
        } elseif (Test-Path "$RocmPath/bin/llvm-rc.exe") {
            $RcCompiler = "$RocmPath/bin/llvm-rc.exe"
        } else {
            $SdkRc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "rc.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\x64\\rc.exe$" } | Select-Object -First 1
            if ($SdkRc) {
                $RcCompiler = $SdkRc.FullName.Replace('\', '/')
            }
        }
        
        $CoreFlags = "-O3 -w -Wno-ignored-attributes -mno-avx512f -Wno-keyword-macro -Wno-extern-initializer -Wno-gnu-anonymous-struct -Wno-nested-anon-types -Wno-language-extension-token -Wno-deprecated-declarations -Wno-double-promotion -fno-math-errno"
        
        $env:HIP_PATH = $RocmPath
        $env:ROCM_PATH = $RocmPath

        mkdir build
        cd build
        
        $CMakeArgs = @(
          "-G", "Ninja",
          "-DCMAKE_C_COMPILER=$ClangBin/clang.exe",
          "-DCMAKE_CXX_COMPILER=$ClangBin/clang++.exe",
          "-DCMAKE_ASM_COMPILER=$ClangBin/clang.exe",
          "-DCMAKE_HIP_COMPILER=$ClangBin/clang++.exe",
          "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
          "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
          "-DCMAKE_HIP_COMPILER_LAUNCHER=ccache",
          "-DCMAKE_HIP_COMPILER_ROCM_ROOT=$RocmPath",
          "-DGGML_HIP=ON",
          "-DGPU_TARGETS=gfx900;gfx906;gfx908;gfx90a;gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201",
          "-DCMAKE_BUILD_TYPE=Release",
          "-DBUILD_SHARED_LIBS=ON",
          "-DGGML_STATIC=OFF",
          "-DGGML_OPENMP=OFF",
          "-DCMAKE_PREFIX_PATH=$RocmPath;$RocmPath/lib/cmake",
          "-DOPENSSL_ROOT_DIR=$OpenSslPath",
          "-DOPENSSL_CRYPTO_LIBRARY=$OpenSslPath/lib/VC/x64/MD/libcrypto.lib",
          "-DOPENSSL_SSL_LIBRARY=$OpenSslPath/lib/VC/x64/MD/libssl.lib",
          "-DLIB_EAY=$OpenSslPath/lib/VC/x64/MD/libcrypto.lib",
          "-DSSL_EAY=$OpenSslPath/lib/VC/x64/MD/libssl.lib",
          "-DCMAKE_C_FLAGS=$CoreFlags",
          "-DCMAKE_CXX_FLAGS=$CoreFlags",
          "-DCMAKE_HIP_FLAGS=$CoreFlags -Xclang -fno-cuda-host-device-constexpr -mllvm -amdgpu-early-inline-all=true"
        )
        
        if ($RcCompiler) {
            $CMakeArgs += "-DCMAKE_RC_COMPILER=$RcCompiler"
        }
        
        & cmake $CMakeArgs ..
          
        $ParallelJobs = [int]$env:NUMBER_OF_PROCESSORS
        if ($ParallelJobs -lt 1) { $ParallelJobs = 2 }
        Write-Host "Building with $ParallelJobs parallel jobs (matching runner vCPUs to prevent RAM thrashing)..."
        & cmake --build . --config Release --parallel $ParallelJobs
        
        ccache -s

    - name: Save ccache directly after build
      uses: actions/cache/save@v4
      if: always()
      with:
        path: .ccache
        key: ${{ runner.os }}-${{ matrix.flavor }}-rocm-ccache-${{ github.run_id }}

    - name: Archive build output
      run: |
        $zipName = "llama-rocm-${{ matrix.flavor }}-windows.zip"
        Write-Host "Creating archive $zipName for flavor ${{ matrix.flavor }}..."

        Copy-Item "C:\TheRock\build\bin\rocblas.dll" -Destination build\bin\ -ErrorAction SilentlyContinue
        if (Test-Path "C:\TheRock\build\bin\rocblas") {
            Copy-Item "C:\TheRock\build\bin\rocblas" -Destination build\bin\ -Recurse -Force -ErrorAction SilentlyContinue
        }
        Copy-Item "C:\TheRock\build\bin\libhipblaslt.dll" -Destination build\bin\ -ErrorAction SilentlyContinue
        Copy-Item "C:\TheRock\build\bin\hipblas.dll" -Destination build\bin\ -ErrorAction SilentlyContinue
        Copy-Item "C:\TheRock\build\bin\libhipblas.dll" -Destination build\bin\ -ErrorAction SilentlyContinue
        Copy-Item "C:\TheRock\build\bin\amdhip64*.dll" -Destination build\bin\ -ErrorAction SilentlyContinue
        Compress-Archive -Path build\bin\* -DestinationPath $zipName

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: llama-rocm-${{ matrix.flavor }}-windows
        path: llama-rocm-${{ matrix.flavor }}-windows.zip

  build-linux:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      ROCM_PATH: /opt/rocm
      HIP_PATH: /opt/rocm
    
    steps:
    - name: Checkout branch ${{ matrix.branch }}
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}

    - name: Restore ROCm Install Cache
      id: cache-rocm-linux-restore
      uses: actions/cache/restore@v4
      with:
        path: /opt/rocm
        key: rocm-installed-10.0.0-linux-v1

    - name: Download and Install ROCm
      if: steps.cache-rocm-linux-restore.outputs.cache-hit != 'true'
      run: |
        echo "Downloading ROCm 10.0.0 TheRock Linux tarball..."
        sudo mkdir -p /opt/rocm
        sudo chown -R $USER:$USER /opt/rocm
        curl -L -o therock-linux.tar.gz https://stable.repo.amd.com/rocm/core/tarball/therock-dist-linux-gfx120X-all-10.0.0.tar.gz
        
        echo "Extracting tarball to /opt/rocm..."
        tar -xzf therock-linux.tar.gz -C /opt/rocm --strip-components=1
        
        if [ ! -f "/opt/rocm/lib/llvm/bin/clang" ]; then
            echo "ERROR: clang was not found in /opt/rocm/lib/llvm/bin! Extraction failed."
            exit 1
        fi
        
        rm -f therock-linux.tar.gz

    - name: Save ROCm Install Cache
      if: steps.cache-rocm-linux-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /opt/rocm
        key: rocm-installed-10.0.0-linux-v1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build ccache libcurl4-openssl-dev zip git libatomic1 libquadmath0

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-${{ matrix.flavor }}-rocm-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.flavor }}-rocm-ccache-

    - name: Build llama.cpp (${{ matrix.flavor }})
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_COMPILERCHECK: string:rocm-10.0.0
        CCACHE_BASEDIR: ${{ github.workspace }}
      run: |
        ccache -z
        
        export ROCM_PATH=/opt/rocm
        export HIP_PATH=/opt/rocm
        export PATH=/opt/rocm/lib/llvm/bin:/opt/rocm/bin:$PATH
        export LD_LIBRARY_PATH=/opt/rocm/lib:$LD_LIBRARY_PATH
        
        mkdir build
        cd build
        
        export CORE_FLAGS="-O3 -w -Wno-ignored-attributes -mno-avx512f -Wno-keyword-macro -Wno-extern-initializer -Wno-gnu-anonymous-struct -Wno-nested-anon-types -Wno-language-extension-token -Wno-deprecated-declarations -Wno-double-promotion -fno-math-errno -flto=thin"
        
        cmake -G "Ninja" \
          -DCMAKE_C_COMPILER=${ROCM_PATH}/lib/llvm/bin/clang \
          -DCMAKE_CXX_COMPILER=${ROCM_PATH}/lib/llvm/bin/clang++ \
          -DCMAKE_ASM_COMPILER=${ROCM_PATH}/lib/llvm/bin/clang \
          -DCMAKE_HIP_COMPILER=${ROCM_PATH}/lib/llvm/bin/clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
          -DCMAKE_HIP_COMPILER_ROCM_ROOT=${ROCM_PATH} \
          -DGGML_HIP=ON \
          -DGPU_TARGETS="gfx900;gfx906;gfx908;gfx90a;gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DGGML_STATIC=OFF \
          -DGGML_OPENMP=OFF \
          -DCMAKE_PREFIX_PATH="${ROCM_PATH};${ROCM_PATH}/lib/cmake" \
          -DCMAKE_C_FLAGS="$CORE_FLAGS" \
          -DCMAKE_CXX_FLAGS="$CORE_FLAGS" \
          -DCMAKE_HIP_FLAGS="$CORE_FLAGS -mllvm -amdgpu-early-inline-all=true" \
          ..
          
        cmake --build . --config Release --parallel $(nproc)
        
        ccache -s

    - name: Archive build output
      run: |
        ZIP_NAME="llama-rocm-${{ matrix.flavor }}-linux.zip"
        echo "Creating archive ${ZIP_NAME} for flavor ${{ matrix.flavor }}..."

        cp /opt/rocm/lib/librocblas.so* build/bin/ 2>/dev/null || true
        cp -r /opt/rocm/lib/rocblas build/bin/ 2>/dev/null || true
        cp /opt/rocm/lib/libhipblaslt.so* build/bin/ 2>/dev/null || true
        cp /opt/rocm/lib/libhipblas.so* build/bin/ 2>/dev/null || true
        cp /opt/rocm/lib/libamdhip64.so* build/bin/ 2>/dev/null || true

        cd build/bin
        zip -r "../../${ZIP_NAME}" ./*

    - name: Save ccache directly after build
      uses: actions/cache/save@v4
      if: always()
      with:
        path: .ccache
        key: ${{ runner.os }}-${{ matrix.flavor }}-rocm-ccache-${{ github.run_id }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: llama-rocm-${{ matrix.flavor }}-linux
        path: llama-rocm-${{ matrix.flavor }}-linux.zip

  release:
    needs: [setup, build-windows, build-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
    - name: Checkout branch ${{ matrix.branch }} to read commit details
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}

    - name: Determine Release Details
      id: prep
      run: |
        TAG_BASE="${{ needs.setup.outputs.tag_name }}"
        TAG_BASE=$(echo "$TAG_BASE" | sed -e 's/-vanilla$//' -e 's/-experimental$//')
        FINAL_TAG="${TAG_BASE}-${{ matrix.flavor }}"

        COMMIT_SHA=$(git rev-parse HEAD)

        echo "final_tag=$FINAL_TAG" >> $GITHUB_OUTPUT
        echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

        if [ "${{ matrix.flavor }}" = "vanilla" ]; then
          echo "flavor_title=Vanilla TurboQuant" >> $GITHUB_OUTPUT
          echo "flavor_desc=Upstream llama.cpp base with TurboQuant KV cache compression." >> $GITHUB_OUTPUT
        else
          echo "flavor_title=Experimental RDNA Boosts" >> $GITHUB_OUTPUT
          echo "flavor_desc=TurboQuant KV cache + Stew's RDNA Boosts (native-BF16 FA, WMMA, fused GDN, fused MoE) + ROCmFPX quantization family + DFlash2 speculative decoding." >> $GITHUB_OUTPUT
        fi

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: llama-rocm-${{ matrix.flavor }}-windows

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: llama-rocm-${{ matrix.flavor }}-linux

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.prep.outputs.final_tag }}
        name: "llama.cpp ROCm ${{ steps.prep.outputs.final_tag }} [${{ steps.prep.outputs.flavor_title }}]"
        files: |
          llama-rocm-${{ matrix.flavor }}-windows.zip
          llama-rocm-${{ matrix.flavor }}-linux.zip
        body: |
          ### Release Information
          - **Flavor:** `${{ steps.prep.outputs.flavor_title }}`
          - **Source Branch:** `${{ matrix.branch }}`
          - **Commit:** `${{ steps.prep.outputs.commit_sha }}`
          - **ROCm Core SDK:** 10.0.0 (TheRock)
          - **Target GPU Architectures:** `gfx900;gfx906;gfx908;gfx90a;gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201`

          ### Description
          ${{ steps.prep.outputs.flavor_desc }}

          Unified ROCm 10.0.0 (TheRock) release built for Windows and Linux.
          Packages include required AMD ROCm runtime libraries (`rocblas`, `hipblaslt`, `hipblas`, `amdhip64`) for portable out-of-the-box execution.
        draft: false
        prerelease: ${{ matrix.flavor == 'experimental' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
